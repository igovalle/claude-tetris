name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"'
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (un Tetris en JavaScript vanilla con HTML5 Canvas, sin build ni dependencias; toda la lógica vive en game.js). Usa el contexto de arquitectura de CLAUDE.md para entender el código.

            1. Lee el título y la descripción del issue #${{ github.event.issue.number }}.

            2. Ejecuta `gh label list` para confirmar las labels existentes del repo y aplica SOLO las que correspondan con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`. No inventes ni crees labels nuevas. Si el issue fue editado y alguna label ya aplicada dejó de tener sentido, quítala con `gh issue edit ${{ github.event.issue.number }} --remove-label "..."`.

            3. Publica un comentario nuevo con `gh issue comment ${{ github.event.issue.number }} --body "..."` que contenga un diagnóstico técnico con:
               - Resumen del problema en una o dos frases.
               - Causa raíz probable, referenciando archivos/funciones concretas (por ejemplo game.js: collide, tryRotate, clearLines, loop, spawn, etc.) cuando sea posible.
               - Un enfoque de solución sugerido, sin implementarlo todavía, que sirva como punto de partida para el trabajo de código posterior.
               - Si falta información para diagnosticar con confianza, dilo explícitamente en el comentario y pide los datos que faltan en vez de adivinar.

            No modifiques el código del repositorio ni el título o cuerpo del issue. Tu única salida debe ser: labels aplicadas/quitadas y el comentario de diagnóstico.
